<!doctype html>
<html lang="zh-Hant-HK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HK News API</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f7f5ee;
        color: #1d1b16;
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 7vw, 4.25rem);
        line-height: 0.95;
      }

      p {
        max-width: 720px;
        font-size: 1.08rem;
        line-height: 1.7;
      }

      .links {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 12px;
        margin-top: 28px;
      }

      a {
        color: inherit;
      }

      .links a {
        display: block;
        border: 1px solid rgba(29, 27, 22, 0.18);
        border-radius: 8px;
        padding: 18px;
        background: rgba(255, 255, 255, 0.7);
        text-decoration: none;
      }

      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #171916;
          color: #eef0e8;
        }

        .links a {
          border-color: rgba(238, 240, 232, 0.2);
          background: rgba(255, 255, 255, 0.06);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>HK News API</h1>
      <p>一個由人手更新、透過 GitHub Pages 發佈的新聞 JSON API。資料包括媒體來源、新聞標題、簡介、內容摘要、原文連結和更新時間。</p>
      <div class="links">
        <a href="data/sources.json"><strong>Sources</strong><br /><code>/data/sources.json</code></a>
        <a href="data/articles.json"><strong>Articles</strong><br /><code>/data/articles.json</code></a>
        <a href="data/feed.json"><strong>Feed</strong><br /><code>/data/feed.json</code></a>
        <a href="docs/api.md"><strong>API Docs</strong><br /><code>/docs/api.md</code></a>
        <a href="docs/manual-entry.md"><strong>Manual Entry</strong><br /><code>/docs/manual-entry.md</code></a>
      </div>
    </main>
  </body>
</html>
